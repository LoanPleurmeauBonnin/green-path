# Contrôle rapide à chaque push et pull request : scripts, JSON, liens, secrets, crédits (aucune dépendance à installer).
name: Smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/smoke.cjs
      - run: node tools/verify-credits.cjs
