<body>
  <div id="game"></div>
  <p id="loading">CHARGEMENT…</p>
  <!-- Téléphone tenu en portrait : on demande de le tourner (le jeu est en pause). -->
  <div id="rotate" role="alertdialog" aria-live="assertive" aria-label="Veuillez tourner votre téléphone">
    <svg class="rotate-icon" viewBox="0 0 16 16" width="96" height="96" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="5" y="1" width="6" height="11" fill="#f4f7f2"/><rect x="6" y="2" width="4" height="8" fill="#2b3a55"/>
      <rect x="7" y="10" width="2" height="1" fill="#2b3a55"/><rect x="1" y="13" width="3" height="1" fill="#2fbf71"/>
      <rect x="12" y="13" width="3" height="1" fill="#2fbf71"/><rect x="3" y="12" width="1" height="1" fill="#2fbf71"/>
      <rect x="12" y="12" width="1" height="1" fill="#2fbf71"/><rect x="4" y="14" width="8" height="1" fill="#2fbf71"/>
    </svg>
    <p>VEUILLEZ TOURNER<br>VOTRE TÉLÉPHONE</p>
    <p class="small">GREEN PATH SE JOUE EN PAYSAGE</p>
  </div>
  <!-- iPhone / iPad (Safari) : pas de plein écran possible dans le navigateur ; une seule fois, on explique comment. -->
  <div id="ios-tip" role="note" hidden><span id="ios-tip-text"></span></div>
